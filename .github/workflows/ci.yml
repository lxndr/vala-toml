name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            valac \
            libgee-0.8-dev \
            libglib2.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Unit tests
        run: meson test -C build --print-errorlogs --no-rebuild

      - name: TOML 1.1 compliance (toml-test)
        run: ./scripts/run-toml-test.sh
